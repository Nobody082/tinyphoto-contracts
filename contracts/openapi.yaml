components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Supabase JWT}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    ExpectedVersion: {name: expected_version, in: query, required: true, schema: {type: integer, minimum: 1}, description: Current room version; compare atomically. Already completed no-ops succeed before version comparison.}
    RoomId: {name: room_id, in: path, required: true, schema: {type: string, format: uuid}}
    RoundId: {name: round_id, in: path, required: true, schema: {type: string, format: uuid}}
    MediaId: {name: media_id, in: path, required: true, schema: {type: string, format: uuid}}
    ConversationId: {name: conversation_id, in: path, required: true, schema: {type: string, format: uuid}}
    ShotIndex: {name: shot_index, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 3}}
    UserId: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    FrameId: {name: frame_id, in: path, required: true, schema: {type: string, format: uuid}}
    MemoryId: {name: memory_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Unauthorized: {description: 'Missing, invalid or expired credentials', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Authenticated but operation requires host or authorized purpose, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Unknown or inaccessible resource/code, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Version/state/capacity/idempotency/upload conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Gone: {description: Owned media reservation or content expired, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Invalid: {description: Invalid request including missing required headers or cross-field constraint, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited:
      description: Rate or free-budget admission limit reached
      headers: {Retry-After: {required: true, schema: {type: integer, minimum: 1}, description: Seconds before retry}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: Dependency unavailable or signing conformance gate not passed
      headers: {Retry-After: {required: true, schema: {type: integer, minimum: 1}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Time:
      type: object
      additionalProperties: false
      required: [server_time]
      properties: {server_time: {type: string, format: date-time}}
    UserRole:
      type: string
      enum: [USER, ADMIN]
    User:
      type: object
      additionalProperties: false
      required: [id, display_name, role, disabled]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1, maxLength: 60}
        email: {type: [string, 'null'], maxLength: 254}
        date_of_birth: {type: [string, 'null'], maxLength: 32}
        role: {$ref: '#/components/schemas/UserRole'}
        disabled: {type: boolean}
    GoogleCredentials:
      type: object
      additionalProperties: false
      required: [id_token, nonce]
      properties:
        id_token: {type: string, minLength: 1, maxLength: 8192, writeOnly: true}
        nonce: {type: string, minLength: 32, maxLength: 128, writeOnly: true, description: Cryptographically random raw nonce; Google receives SHA-256 hex}
        provider_access_token: {type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Required when Google ID token includes at_hash}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password, confirm_password]
      properties:
        full_name: {type: string, minLength: 1, maxLength: 60}
        email: {type: string, minLength: 3, maxLength: 254}
        phone: {type: [string, 'null'], minLength: 8, maxLength: 24}
        date_of_birth: {type: [string, 'null'], maxLength: 32}
        password: {type: string, minLength: 8, maxLength: 72, writeOnly: true}
        confirm_password: {type: string, minLength: 8, maxLength: 72, writeOnly: true}
    PasswordCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 72, writeOnly: true}
    RefreshCredentials:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties: {refresh_token: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}}
    Session:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_at, user]
      properties:
        access_token: {type: string, minLength: 1}
        refresh_token: {type: string, minLength: 1}
        token_type: {const: Bearer}
        expires_at: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    RoomFrameLayout:
      type: string
      enum: [STRIP_2X1, STRIP_3X1, GRID_2X2, STRIP_4X1, GRID_3X2]
    CreateRoom:
      type: object
      additionalProperties: false
      required: [capacity]
      properties:
        capacity: {type: integer, minimum: 2, maximum: 6}
        frame_layout: {$ref: '#/components/schemas/RoomFrameLayout'}
        frame_id: {type: [string, 'null'], format: uuid}
    JoinRoom:
      type: object
      additionalProperties: false
      required: [code]
      properties: {code: {type: string, pattern: '^[0-9]{6}$', examples: ['042781']}}
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties: {expected_version: {type: integer, minimum: 1}}
    StartRoundRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
        countdown_seconds: {type: integer, minimum: 0, maximum: 10}
    MoveSlotRequest:
      type: object
      additionalProperties: false
      required: [expected_version, slot_index]
      properties:
        expected_version: {type: integer, minimum: 1}
        slot_index: {type: integer, minimum: 0, maximum: 5}
    ReadyRequest:
      type: object
      additionalProperties: false
      required: [ready]
      properties: {ready: {type: boolean}}
    Member:
      type: object
      additionalProperties: false
      required: [user_id, display_name, ready, joined_at, slot_index]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1, maxLength: 60}
        ready: {type: boolean}
        joined_at: {type: string, format: date-time}
        slot_index: {type: integer, minimum: 0, maximum: 5}
    RoomState: {type: string, enum: [LOBBY, ACTIVE, CLOSED, EXPIRED]}
    RoundState: {type: string, enum: [COUNTDOWN, COLLECTING, COMPOSING, COMPLETE, CANCELLED, EXPIRED]}
    Slot:
      type: object
      additionalProperties: false
      required: [user_id, shot_index, media_id, captured_at]
      properties:
        user_id: {type: string, format: uuid}
        shot_index: {type: integer, minimum: 0, maximum: 3}
        media_id: {type: string, format: uuid}
        captured_at: {type: string, format: date-time, description: Informational client exposure time; not trusted for admission}
    Round:
      type: object
      additionalProperties: false
      required: [id, state, participant_ids, shutter_times, materialized_shots, upload_deadline, composition_deadline, slots, final_media_id]
      properties:
        id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/RoundState'}
        participant_ids: {type: array, minItems: 2, maxItems: 6, uniqueItems: true, items: {type: string, format: uuid}}
        shutter_times: {type: array, minItems: 4, maxItems: 4, items: {type: string, format: date-time}, description: Index 0..3; strictly ascending four-second intervals}
        materialized_shots: {type: array, maxItems: 4, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 3}}
        upload_deadline: {type: string, format: date-time}
        composition_deadline: {type: string, format: date-time}
        slots: {type: array, maxItems: 24, items: {$ref: '#/components/schemas/Slot'}}
        final_media_id: {type: [string, 'null'], format: uuid}
    RoomSnapshot:
      type: object
      additionalProperties: false
      required: [id, code, host_id, capacity, frame_layout, state, room_version, channel_topic, expires_at, server_time, members, round]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[0-9]{6}$'}
        host_id: {type: string, format: uuid}
        capacity: {type: integer, minimum: 2, maximum: 6}
        frame_layout: {$ref: '#/components/schemas/RoomFrameLayout'}
        frame_id: {type: [string, 'null'], format: uuid}
        state: {$ref: '#/components/schemas/RoomState'}
        room_version: {type: integer, minimum: 1}
        channel_topic: {type: string, pattern: '^room:[0-9a-f-]{36}:v[1-9][0-9]*$'}
        expires_at: {type: string, format: date-time}
        server_time: {type: string, format: date-time}
        members: {type: array, minItems: 1, maxItems: 6, items: {$ref: '#/components/schemas/Member'}}
        round: {oneOf: [{$ref: '#/components/schemas/Round'}, {type: 'null'}], description: Current or most recent round; terminal snapshot remains recoverable}
    UploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, content_type, size_bytes, width, height]
      properties:
        purpose: {type: string, enum: [SLOT, INDIVIDUAL, GROUP_COMPOSITION]}
        content_type: {type: string, enum: [image/jpeg, image/png, image/avif]}
        size_bytes: {type: integer, minimum: 1, maximum: 4000000}
        width: {type: integer, minimum: 1, maximum: 6000}
        height: {type: integer, minimum: 1, maximum: 6000}
        room_id: {type: string, format: uuid}
        round_id: {type: string, format: uuid}
        shot_index: {type: integer, minimum: 0, maximum: 3}
        captured_at: {type: string, format: date-time}
        source_media_ids: {type: array, minItems: 8, maxItems: 24, uniqueItems: true, items: {type: string, format: uuid}}
      allOf:
        - if: {properties: {purpose: {const: SLOT}}}
          then:
            required: [room_id, round_id, shot_index, captured_at]
            properties: {size_bytes: {maximum: 2000000}, width: {maximum: 1500}, height: {maximum: 1500}}
            not: {required: [source_media_ids]}
        - if: {properties: {purpose: {const: INDIVIDUAL}}}
          then:
            properties: {size_bytes: {maximum: 2000000}}
            not: {anyOf: [{required: [room_id]}, {required: [round_id]}, {required: [shot_index]}, {required: [captured_at]}, {required: [source_media_ids]}]}
        - if: {properties: {purpose: {const: GROUP_COMPOSITION}}}
          then:
            required: [room_id, round_id, source_media_ids]
            not: {anyOf: [{required: [shot_index]}, {required: [captured_at]}]}
    UploadGrant:
      type: object
      additionalProperties: false
      required: [media_id, method, url, headers, required_content_length, expires_at, media_expires_at]
      properties:
        media_id: {type: string, format: uuid}
        method: {const: PUT}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: false
          required: [Content-Type, Cache-Control, If-None-Match]
          properties:
            Content-Type: {type: string, enum: [image/jpeg, image/png, image/avif]}
            Cache-Control: {const: 'no-store, max-age=0'}
            If-None-Match: {const: '*'}
        required_content_length: {type: integer, minimum: 1, maximum: 4000000, description: 'Signed Content-Length; browser derives from Blob, native sends exact length'}
        expires_at: {type: string, format: date-time, description: Minimum of now+120 seconds and upload/composition deadline; completion must precede that deadline}
        media_expires_at: {type: string, format: date-time, description: Final logical expiry is seven days after reservation; slots may be purged earlier}
    MediaReceipt:
      type: object
      additionalProperties: false
      required: [media_id, purpose, status, expires_at, own_memory_id]
      properties:
        media_id: {type: string, format: uuid}
        purpose: {type: string, enum: [SLOT, INDIVIDUAL, GROUP_COMPOSITION]}
        status: {const: COMMITTED}
        expires_at: {type: string, format: date-time}
        own_memory_id: {type: [string, 'null'], format: uuid, description: Null for SLOT; final returns caller's independent memory reference}
    DownloadGrant:
      type: object
      additionalProperties: false
      required: [media_id, method, url, expires_at]
      properties:
        media_id: {type: string, format: uuid}
        method: {const: GET}
        url: {type: string, format: uri}
        expires_at: {type: string, format: date-time, description: Minimum of now+60 seconds and logical media expiry}
    Memory:
      type: object
      additionalProperties: false
      required: [id, media_id, purpose, content_type, width, height, size_bytes, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        media_id: {type: string, format: uuid}
        purpose: {type: string, enum: [INDIVIDUAL, GROUP_COMPOSITION]}
        content_type: {type: string, enum: [image/jpeg, image/png, image/avif]}
        width: {type: integer, minimum: 1, maximum: 6000}
        height: {type: integer, minimum: 1, maximum: 6000}
        size_bytes: {type: integer, minimum: 1, maximum: 4000000}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    MemoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Memory'}}
        next_cursor: {type: [string, 'null'], maxLength: 512}
    ChatPeer:
      type: object
      additionalProperties: false
      required: [id, display_name, online, last_seen]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1, maxLength: 60}
        online: {type: boolean}
        last_seen: {type: string, format: date-time}
    ChatDirectory:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ChatPeer'}}
    ChatPublicKey:
      type: object
      additionalProperties: false
      required: [key_id, user_id, public_key_spki, algorithm, device_label, is_active, created_at]
      properties:
        key_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        public_key_spki: {type: string, minLength: 32, maxLength: 512}
        algorithm: {const: ECDH-P256-AES256GCM-V1}
        device_label: {type: string, minLength: 1, maxLength: 40}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
    ChatPublicKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ChatPublicKey'}}
    RegisterChatKeyRequest:
      type: object
      additionalProperties: false
      required: [key_id, public_key_spki, algorithm, device_label]
      properties:
        key_id: {type: string, format: uuid}
        public_key_spki: {type: string, minLength: 32, maxLength: 512}
        algorithm: {const: ECDH-P256-AES256GCM-V1}
        device_label: {type: string, minLength: 1, maxLength: 40}
    ChatKeyBackup:
      type: object
      additionalProperties: false
      required: [key_id, public_key_spki, wrapped_private_key, salt, iv, kdf_iterations, updated_at]
      properties:
        key_id: {type: string, format: uuid}
        public_key_spki: {type: string, minLength: 32, maxLength: 512}
        wrapped_private_key: {type: string, minLength: 32, maxLength: 2048}
        salt: {type: string, minLength: 16, maxLength: 128}
        iv: {type: string, minLength: 12, maxLength: 64}
        kdf_iterations: {type: integer, minimum: 100000, maximum: 1000000}
        updated_at: {type: string, format: date-time}
    SaveChatKeyBackupRequest:
      type: object
      additionalProperties: false
      required: [key_id, wrapped_private_key, salt, iv, kdf_iterations]
      properties:
        key_id: {type: string, format: uuid}
        wrapped_private_key: {type: string, minLength: 32, maxLength: 2048}
        salt: {type: string, minLength: 16, maxLength: 128}
        iv: {type: string, minLength: 12, maxLength: 64}
        kdf_iterations: {type: integer, minimum: 100000, maximum: 1000000}
    ChatKeyStatus:
      type: object
      additionalProperties: false
      required: [key, has_backup, backup]
      properties:
        key: {$ref: '#/components/schemas/ChatPublicKey'}
        has_backup: {type: boolean}
        backup: {oneOf: [{$ref: '#/components/schemas/ChatKeyBackup'}, {type: 'null'}]}
    ChatKeyEnvelope:
      type: object
      additionalProperties: false
      required: [key_id, ephemeral_public_key, key_iv, wrapped_key]
      properties:
        key_id: {type: string, format: uuid}
        ephemeral_public_key: {type: string, minLength: 32, maxLength: 512}
        key_iv: {type: string, minLength: 12, maxLength: 64}
        wrapped_key: {type: string, minLength: 32, maxLength: 256}
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, conversation_id, seq, sender_id, sender_key_id, message_type, ciphertext, iv, aad, envelopes, created_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        seq: {type: integer, minimum: 1}
        sender_id: {type: string, format: uuid}
        sender_key_id: {type: string, format: uuid}
        message_type: {type: string, enum: [TEXT, REACTION, SYSTEM]}
        ciphertext: {type: string, minLength: 16, maxLength: 6000}
        iv: {type: string, minLength: 12, maxLength: 64}
        aad: {type: string, minLength: 1, maxLength: 256}
        envelopes: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/ChatKeyEnvelope'}}
        created_at: {type: string, format: date-time}
    ChatMessagePage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ChatMessage'}}
        has_more: {type: boolean}
    SendChatMessageRequest:
      type: object
      additionalProperties: false
      required: [message_id, sender_key_id, message_type, ciphertext, iv, aad, envelopes]
      properties:
        message_id: {type: string, format: uuid}
        sender_key_id: {type: string, format: uuid}
        message_type: {type: string, enum: [TEXT, REACTION]}
        ciphertext: {type: string, minLength: 16, maxLength: 6000}
        iv: {type: string, minLength: 12, maxLength: 64}
        aad: {type: string, minLength: 1, maxLength: 256}
        envelopes: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/ChatKeyEnvelope'}}
    ChatParticipant:
      type: object
      additionalProperties: false
      required: [user_id, display_name, online, last_seen, last_delivered_seq, last_read_seq, last_read_at, active_keys]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string, minLength: 1, maxLength: 60}
        online: {type: boolean}
        last_seen: {type: string, format: date-time}
        last_delivered_seq: {type: integer, minimum: 0}
        last_read_seq: {type: integer, minimum: 0}
        last_read_at: {type: [string, 'null'], format: date-time}
        active_keys: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/ChatPublicKey'}}
    ChatConversation:
      type: object
      additionalProperties: false
      required: [id, kind, title, channel_topic, created_at, last_message_at, last_message_seq, unread_count, participants, last_message]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [DIRECT, GROUP]}
        title: {type: [string, 'null'], maxLength: 80}
        channel_topic: {type: string, pattern: '^chat:[0-9a-f-]{36}:v[1-9][0-9]*$'}
        created_at: {type: string, format: date-time}
        last_message_at: {type: [string, 'null'], format: date-time}
        last_message_seq: {type: integer, minimum: 0}
        unread_count: {type: integer, minimum: 0}
        participants: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/ChatParticipant'}}
        last_message: {oneOf: [{$ref: '#/components/schemas/ChatMessage'}, {type: 'null'}]}
    ChatInbox:
      type: object
      additionalProperties: false
      required: [items, inbox_channel, unread_total]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ChatConversation'}}
        inbox_channel: {type: string, pattern: '^chat-inbox:[0-9a-f-]{36}$'}
        unread_total: {type: integer, minimum: 0}
    CreateDirectConversationRequest:
      type: object
      additionalProperties: false
      required: [peer_user_id]
      properties:
        peer_user_id: {type: string, format: uuid}
    ChatReceiptRequest:
      type: object
      additionalProperties: false
      properties:
        delivered_seq: {type: [integer, 'null'], minimum: 0}
        read_seq: {type: [integer, 'null'], minimum: 0}
    ChatReceiptResponse:
      type: object
      additionalProperties: false
      required: [conversation_id, user_id, last_delivered_seq, last_read_seq, last_read_at]
      properties:
        conversation_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        last_delivered_seq: {type: integer, minimum: 0}
        last_read_seq: {type: integer, minimum: 0}
        last_read_at: {type: [string, 'null'], format: date-time}
    ChatTypingRequest:
      type: object
      additionalProperties: false
      required: [is_typing]
      properties:
        is_typing: {type: boolean}
    FrameCategory:
      type: string
      enum: [STAMP, PHOTOBOOTH]
    FrameLayout:
      type: string
      enum: [STAMP_1X1, STRIP_2X1, STRIP_3X1, GRID_2X2, STRIP_4X1, GRID_3X2]
    Frame:
      type: object
      additionalProperties: false
      required: [id, name, category, layout, background_color, border_color, accent_color, text_color, caption_text, border_width, perforated, active, sort_order, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        category: {$ref: '#/components/schemas/FrameCategory'}
        layout: {$ref: '#/components/schemas/FrameLayout'}
        background_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        border_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        accent_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        text_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        caption_text: {type: string, maxLength: 60}
        border_width: {type: integer, minimum: 0, maximum: 48}
        perforated: {type: boolean}
        active: {type: boolean}
        sort_order: {type: integer, minimum: 0, maximum: 10000}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FrameList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Frame'}}
    CreateFrameRequest:
      type: object
      additionalProperties: false
      required: [name, category, layout]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        category: {$ref: '#/components/schemas/FrameCategory'}
        layout: {$ref: '#/components/schemas/FrameLayout'}
        background_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#FFF8E7'}
        border_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#181818'}
        accent_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#FFD447'}
        text_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$', default: '#181818'}
        caption_text: {type: string, maxLength: 60, default: 'TINYPHOTO'}
        border_width: {type: integer, minimum: 0, maximum: 48, default: 6}
        perforated: {type: boolean, default: true}
        active: {type: boolean, default: true}
        sort_order: {type: integer, minimum: 0, maximum: 10000, default: 100}
    UpdateFrameRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: [string, 'null'], minLength: 1, maxLength: 80}
        category: {oneOf: [{$ref: '#/components/schemas/FrameCategory'}, {type: 'null'}]}
        layout: {oneOf: [{$ref: '#/components/schemas/FrameLayout'}, {type: 'null'}]}
        background_color: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$'}
        border_color: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$'}
        accent_color: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$'}
        text_color: {type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$'}
        caption_text: {type: [string, 'null'], maxLength: 60}
        border_width: {type: [integer, 'null'], minimum: 0, maximum: 48}
        perforated: {type: [boolean, 'null']}
        active: {type: [boolean, 'null']}
        sort_order: {type: [integer, 'null'], minimum: 0, maximum: 10000}
    AdminOverview:
      type: object
      additionalProperties: false
