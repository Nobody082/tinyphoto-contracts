openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: tinyphoto API
  version: 1.1.0
  description: |
    Metadata-only API. Images travel directly between client RAM and private R2.
    1.1.0 adds image/avif (additive). Readers must accept image/avif before any
    writer uploads it; the backend keeps AVIF reservations behind an operator gate.
    All responses use Cache-Control: no-store. Dates are UTC RFC3339.
    Mutating POST commands require Idempotency-Key except authentication; keys are
    actor+route scoped for 24h. Same key/body returns the original result; a
    changed body returns 409. Read-only download grants omit idempotency keys.
    Expired signed URLs are never silently renewed. Idempotency records contain
    metadata only; reconstruct upload signatures with the original signing time.
    JWTs are Supabase access tokens, never Google ID tokens outside auth/google.
    Snapshot GET lazily materializes expiry. Inaccessible resources return 404.
servers:
  - url: /
    description: Configured backend origin; clients supply its deployment base URL.
security:
  - bearerAuth: []
tags:
  - {name: Auth}
  - {name: Frames}
  - {name: Admin}
  - {name: Rooms}
  - {name: Media}
  - {name: Memories}
  - {name: Chat}
  - {name: System}
paths:
  /api/v1/time:
    get:
      operationId: getServerTime
      tags: [System]
      security: []
      summary: UTC clock sample for midpoint offset measurement
      responses:
        '200': {description: Clock sample, content: {application/json: {schema: {$ref: '#/components/schemas/Time'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/google:
    post:
      operationId: exchangeGoogleToken
      tags: [Auth]
      security: []
      summary: Exchange Google ID token and nonce for a Supabase session
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GoogleCredentials'}}}}
      responses:
        '200': {description: Session credentials; no server-side token persistence or idempotency record, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      security: []
      summary: Register a new email/password account; existing emails return 409 CONFLICT
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
      responses:
        '201': {description: Registered user; no sensitive information returned, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/login:
    post:
      operationId: loginWithPassword
      tags: [Auth]
      security: []
      summary: Authenticate with email and password for a Supabase session
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PasswordCredentials'}}}}
      responses:
        '200': {description: Session credentials; no server-side token persistence or idempotency record, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: []
      summary: Rotate refresh token; serialize client calls and discard old token
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshCredentials'}}}}
      responses:
        '200': {description: Rotated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/logout:
    post:
      operationId: logoutSession
      tags: [Auth]
      summary: Revoke current refresh session; issued JWTs expire normally
      responses:
        '204': {description: Session revoked; clear RAM and close channels}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        '200': {description: Verified user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms:
    post:
      operationId: createRoom
      tags: [Rooms]
      summary: Create 60-minute room and add caller as unready host
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRoom'}}}}
      responses:
        '201': {description: Room snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/join:
    post:
      operationId: joinRoom
      tags: [Rooms]
      summary: Join a LOBBY by code; capacity and one-active-room rule are atomic
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JoinRoom'}}}}
      responses:
        '200': {description: Joined snapshot; existing active membership is a no-op, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}:
    parameters: [{$ref: '#/components/parameters/RoomId'}]
    get:
      operationId: getRoomSnapshot
      tags: [Rooms]
      summary: Consistent snapshot; active members only, including terminal state
      responses:
        '200': {description: Subscribe first then snapshot to recover event gaps, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: closeRoom
      tags: [Rooms]
      summary: Host closes room and cancels active round; repeated close is a no-op
      parameters: [{$ref: '#/components/parameters/ExpectedVersion'}]
      responses:
        '204': {description: Closed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}/members/me:
    parameters: [{$ref: '#/components/parameters/RoomId'}]
    patch:
      operationId: setReady
      tags: [Rooms]
      summary: Set own ready flag in LOBBY after camera and clock checks
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReadyRequest'}}}}
      responses:
        '200': {description: Snapshot; repeated flag is a no-op, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: leaveRoom
      tags: [Rooms]
      summary: Leave LOBBY; host leave closes room; rotate channel epoch for member leave
      responses:
        '204': {description: Left; repeat by former member is a no-op}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}/members/me/slot:
    parameters: [{$ref: '#/components/parameters/RoomId'}]
    patch:
      operationId: moveRoomSlot
      tags: [Rooms]
      summary: Move active member (including host) to an unoccupied frame slot in LOBBY
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MoveSlotRequest'}}}}
      responses:
        '200': {description: Snapshot with updated slot_index and room_version, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}/members/{user_id}:
    parameters:
      - {$ref: '#/components/parameters/RoomId'}
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: kickRoomMember
      tags: [Rooms]
      summary: Host removes a participant in LOBBY and rotates channel epoch
      parameters: [{$ref: '#/components/parameters/ExpectedVersion'}]
      responses:
        '200': {description: Updated snapshot for host; former members refetch or leave, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}/rounds:
    parameters: [{$ref: '#/components/parameters/RoomId'}]
    post:
      operationId: startRound
      tags: [Rooms]
      summary: Host freezes 2–6 ready participants and schedules four absolute shutters
      description: Requires at least 300 seconds remaining before room expiry; otherwise 409 STATE_CONFLICT.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartRoundRequest'}}}}
      responses:
        '201': {description: Snapshot including countdown, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}/rounds/{round_id}:
    parameters: [{$ref: '#/components/parameters/RoomId'}, {$ref: '#/components/parameters/RoundId'}]
    delete:
      operationId: cancelRound
      tags: [Rooms]
      summary: Host cancels a nonterminal round and resets ready flags
      parameters: [{$ref: '#/components/parameters/ExpectedVersion'}]
      responses:
        '204': {description: Cancelled; already cancelled is a no-op}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/rooms/{room_id}/rounds/{round_id}/shutters/{shot_index}:
    parameters: [{$ref: '#/components/parameters/RoomId'}, {$ref: '#/components/parameters/RoundId'}, {$ref: '#/components/parameters/ShotIndex'}]
    post:
      operationId: materializeShutter
      tags: [Rooms]
      summary: Any frozen participant materializes due shutter once; never schedules hardware capture
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Snapshot; no new event if already materialized, content: {application/json: {schema: {$ref: '#/components/schemas/RoomSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/media/presigned-upload:
    post:
      operationId: reserveMediaUpload
      tags: [Media]
      summary: Reserve quota and grant private, exact-size conditional PUT for 120 seconds
      description: |
        No bytes in this request. Slot requires room_id, round_id, shot_index and
        captured_at; caller must own that frozen slot and its due shutter must be materialized.
        Group composition requires room_id, round_id and all source_media_ids;
        caller must be host and round must be COMPOSING. Individual forbids room
        fields. Invalid cross-field combinations return 422. Pending reservations
        are unique per logical slot/final; an existing live reservation returns 409.
        Sign Content-Type, Content-Length, Cache-Control and If-None-Match: *.
        Adapter fails closed if exact-size or conditional create is unsupported.
        image/avif returns 422 VALIDATION_ERROR while the operator AVIF gate is off;
        the client then re-encodes in RAM as PNG (perforated stamp, alpha) or JPEG.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadRequest'}}}}
      responses:
        '201': {description: Reserved PUT grant, content: {application/json: {schema: {$ref: '#/components/schemas/UploadGrant'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/media/{media_id}/complete:
    parameters: [{$ref: '#/components/parameters/MediaId'}]
    post:
      operationId: completeMediaUpload
      tags: [Media]
      summary: Owner commits after HEAD verification; slot emits event, final creates memories
      description: Missing or mismatched R2 object returns 409; expiry returns 410. No client ETag is trusted. Conditional create prevents overwrite after HEAD. Response is intrinsically idempotent by media_id.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Committed receipt, content: {application/json: {schema: {$ref: '#/components/schemas/MediaReceipt'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/media/{media_id}/presigned-download:
    parameters: [{$ref: '#/components/parameters/MediaId'}]
    post:
      operationId: grantMediaDownload
      tags: [Media]
      summary: Grant 60-second GET to memory owner or frozen participant composing active round
      description: Slot grants stop once round is terminal. Final grants require a live own memory reference. GET URL is bearer access until expiry; never store it. Inaccessible IDs return 404.
      responses:
        '200': {description: RAM-only download grant, content: {application/json: {schema: {$ref: '#/components/schemas/DownloadGrant'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/memories:
    get:
      operationId: listMemories
      tags: [Memories]
      summary: Own unexpired committed memories, newest first, cursor ordered by created_at and id
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: cursor, in: query, schema: {type: string, minLength: 1, maxLength: 512}, description: Opaque signed cursor from preceding page; malformed cursor returns 422}
      responses:
        '200': {description: Metadata only; request separate download grants, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/memories/{memory_id}:
    parameters:
      - {name: memory_id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: deleteMemory
      tags: [Memories]
      summary: Delete own reference immediately; shared object queued only after last reference and PUT expiry
      responses:
        '204': {description: Deleted or previously deleted by same owner; issued GETs can survive 60 seconds}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/users:
    get:
      operationId: searchChatUsers
      tags: [Chat]
      summary: Search registered tinyphoto users to start an encrypted conversation
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}}
      responses:
        '200': {description: Matching user directory, content: {application/json: {schema: {$ref: '#/components/schemas/ChatDirectory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/keys:
    post:
      operationId: registerChatKey
      tags: [Chat]
      summary: Register current device/session ECDH P-256 public key for client-side E2EE
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterChatKeyRequest'}}}}
      responses:
        '201': {description: Active key and optional PIN-wrapped key backup metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ChatKeyStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/keys/backup:
    get:
      operationId: getChatKeyBackup
      tags: [Chat]
      summary: Fetch user PIN-wrapped E2EE private key backup (never plaintext)
      responses:
        '200': {description: Encrypted private key backup, content: {application/json: {schema: {$ref: '#/components/schemas/ChatKeyBackup'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: saveChatKeyBackup
      tags: [Chat]
      summary: Save PIN-wrapped E2EE private key backup encrypted in client RAM
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveChatKeyBackupRequest'}}}}
      responses:
        '200': {description: Saved encrypted backup, content: {application/json: {schema: {$ref: '#/components/schemas/ChatKeyBackup'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/conversations:
    get:
      operationId: listChatConversations
      tags: [Chat]
      summary: List encrypted conversations, participants, unread counts, and latest encrypted message
      responses:
        '200': {description: Conversation inbox, content: {application/json: {schema: {$ref: '#/components/schemas/ChatInbox'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createOrGetDirectConversation
      tags: [Chat]
      summary: Atomically create or return the direct E2EE conversation with a peer user
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateDirectConversationRequest'}}}}
      responses:
        '200': {description: Direct conversation snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/ChatConversation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/conversations/{conversation_id}/keys:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    get:
      operationId: getConversationKeys
      tags: [Chat]
      summary: Fetch active E2EE public keys for participants in the conversation
      responses:
        '200': {description: Participant public keys, content: {application/json: {schema: {$ref: '#/components/schemas/ChatPublicKeyList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/conversations/{conversation_id}/messages:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    get:
      operationId: listChatMessages
      tags: [Chat]
      summary: List ciphertext messages in ascending sequence order for a slice
      parameters:
        - {name: before_seq, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 30}}
      responses:
        '200': {description: Encrypted message slice, content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessagePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: sendChatMessage
      tags: [Chat]
      summary: Relay and persist an end-to-end encrypted message (server never sees plaintext)
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SendChatMessageRequest'}}}}
      responses:
        '201': {description: Persisted encrypted message receipt, content: {application/json: {schema: {$ref: '#/components/schemas/ChatMessage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/conversations/{conversation_id}/receipts:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    post:
      operationId: ackChatReceipt
      tags: [Chat]
      summary: Advance monotonic delivered/read watermark for the authenticated participant
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChatReceiptRequest'}}}}
      responses:
        '200': {description: Updated participant watermark, content: {application/json: {schema: {$ref: '#/components/schemas/ChatReceiptResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/chat/conversations/{conversation_id}/typing:
    parameters: [{$ref: '#/components/parameters/ConversationId'}]
    post:
      operationId: sendChatTyping
      tags: [Chat]
      summary: Broadcast ephemeral typing state over private chat Realtime channel
